<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fruit Stand Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1c0b2b;--bg2:#3a1245;--panel:#2b1240;--line:#4b2263;--text:#fff3e6;--mute:#c9a9d9;--lime:#c8f560;--peach:#ffb37a;--berry:#ff4f8b;--glow:#ff4d4d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--text);background:radial-gradient(1200px 700px at 30% 0%,var(--bg2),var(--bg) 70%) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.app{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;max-width:1100px;margin:0 auto;padding:20px}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px 16px 80px;border-radius:32px;background:linear-gradient(160deg,#4a1a5c 0%,#2b1240 60%);border:2px solid var(--line);min-height:560px;overflow:hidden}
.stage::after{content:"";position:absolute;inset:auto -10% -30px -10%;height:90px;background:repeating-linear-gradient(90deg,#ff4f8b 0 40px,#fff3e6 40px 80px);border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.9}
h1{margin:0;font-size:1.1rem;font-weight:600;color:var(--peach);letter-spacing:.02em}
.count{font-size:clamp(2.6rem,8vw,4.2rem);font-weight:700;line-height:1;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:1rem}
.sub b{color:var(--lime);font-weight:600}
#fruit{position:relative;margin:26px 0 18px;width:min(300px,72vw);aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--glow) 45%,transparent),transparent 68%);font-size:min(11rem,38vw);line-height:1;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s;animation:bob 3.2s ease-in-out infinite}
#fruit span{display:block;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));pointer-events:none}
#fruit:hover{transform:scale(1.05)}
#fruit.pop{animation:none;transform:scale(.9) rotate(-4deg)}
#fruit:focus-visible,.item:focus-visible,.btn:focus-visible{outline:3px solid var(--lime);outline-offset:4px}
@keyframes bob{50%{transform:translateY(-8px) rotate(1.5deg)}}
.stat{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;z-index:1}
.chip{background:#ffffff14;border-radius:999px;padding:6px 14px;font-size:.95rem;color:var(--mute)}
.chip b{color:var(--text);font-weight:600}
.stage .bar{width:min(340px,80%);height:10px;border-radius:99px;background:#ffffff1a;margin-top:16px;overflow:hidden;z-index:1}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--peach));border-radius:99px;transition:width .3s}
.next{font-size:.85rem;color:var(--mute);margin-top:6px;z-index:1}
.fx{position:absolute;pointer-events:none;font-weight:700;font-size:1.6rem;color:var(--lime);text-shadow:0 2px 0 #0006;animation:up .9s ease-out forwards;z-index:5}
.bit{position:absolute;pointer-events:none;font-size:1.2rem;z-index:4;animation:fly .8s ease-out forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
#gold{position:absolute;z-index:6;font-size:3.4rem;border:0;background:none;cursor:pointer;animation:gl 1s ease-in-out infinite;filter:drop-shadow(0 0 14px gold)}
@keyframes gl{50%{transform:scale(1.2) rotate(12deg)}}
.shop{display:flex;flex-direction:column;gap:10px}
.shop h2{margin:14px 4px 2px;font-size:1.15rem;font-weight:600;color:var(--peach)}
.shop h2:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:10px 14px;cursor:pointer;transition:transform .1s,border-color .15s,background .15s}
.item.ok{border-color:#7fae2e;background:#34204a}
.item.ok:hover{transform:translateX(-4px);border-color:var(--lime)}
.item:not(.ok){opacity:.55;cursor:not-allowed}
.item .e{font-size:2.1rem;width:48px;text-align:center}
.item .t{flex:1;min-width:0}
.item .n{font-weight:600;font-size:1.05rem}
.item .d{font-size:.85rem;color:var(--mute)}
.item .c{font-weight:600;color:var(--lime);font-size:.95rem;white-space:nowrap}
.item .o{font-size:1.6rem;font-weight:700;color:#ffffff40;min-width:34px;text-align:right}
.foot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:10px;color:var(--mute);font-size:.85rem}
.btn{font:inherit;background:none;color:var(--mute);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--berry)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--lime);color:#2a1a00;font-weight:600;padding:10px 20px;border-radius:999px;opacity:0;transition:.3s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.pcard{position:relative;z-index:1;width:min(340px,92%);margin-top:16px;background:#1c0b2bcc;border:2px solid #b98cff;border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;gap:5px;font-size:.85rem;text-align:left}
[hidden]{display:none!important}
.pcard .prow{font-size:.85rem}.pcard .cv{padding:8px;font-size:.95rem}
.prow{display:flex;justify-content:space-between;gap:12px;font-size:.95rem;color:var(--mute)}.prow b{color:var(--text);font-variant-numeric:tabular-nums}.prow.rate b{color:var(--lime)}
#pslide{width:100%;accent-color:#c8f560;margin:4px 0}
.qb{display:flex;gap:8px}.qb .btn{flex:1;padding:6px 4px}
.pre{text-align:center;font-weight:600;color:var(--peach);padding:4px 0}
.cv{font:inherit;font-weight:600;font-size:1.05rem;color:#2a1a00;background:var(--lime);border:0;border-radius:999px;padding:12px;cursor:pointer;transition:transform .1s}
.cv:hover:not(:disabled){transform:scale(1.02)}.cv:disabled{opacity:.4;cursor:not-allowed}
.item.done{opacity:1;cursor:default;border-color:#b98cff;background:#3b1c5a}.item.done .c{color:#d9b8ff}
#prest{margin-top:4px}
@media(prefers-reduced-motion:reduce){#fruit,#gold{animation:none}.fx,.bit{animation-duration:.01s}}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <h1 id="title">Your fruit stand</h1>
    <div class="count" id="count">0</div>
    <div class="sub"><span id="fname">apples</span> · <b id="ps">0</b> per second</div>
    <button id="fruit" aria-label="Pick fruit"><span id="emoji">🍎</span></button>
    <div class="stat">
      <div class="chip">Per click <b id="pc">1</b></div>
      <div class="chip">Picked <b id="tot">0</b></div>
      <div class="chip">Prestige points <b id="ppn">0</b></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="next" id="next"></div>
    <div class="pcard" id="pgui" hidden>
      <div class="prow"><span>✨ Picked, unconverted</span><b id="pool">0</b></div>
      <div class="prow"><span>Points to spend</span><b id="pavail">0</b></div>
      <div class="prow"><span>Earned in total (+5% each)</span><b id="pearn">0</b></div>
      <div class="prow rate"><span>Rate</span><b>1M picks = 1 point</b></div>
      <label class="prow" for="pslide"><span>Amount to convert</span><b id="pval">100%</b></label>
      <input type="range" id="pslide" min="0" max="100" step="1" value="100">
      <div class="qb"><button class="btn" data-q="25">25%</button><button class="btn" data-q="50">50%</button><button class="btn" data-q="75">75%</button><button class="btn" data-q="100">Max</button></div>
      <div class="pre" id="ppre"></div>
      <button class="cv" id="pconv">Convert to prestige points</button>
    </div>
  </section>
  <section class="shop">
    <h2>Upgrades</h2>
    <div class="shop" id="ups"></div>
    <h2>Pickers</h2>
    <div class="shop" id="gens"></div>
    <div id="prest"><h2>Prestige upgrades</h2><div class="shop">
      <div class="shop" id="pups"></div></div></div>
    <div class="foot"><span id="saved">Saved in this browser</span><button class="btn" id="reset">Start over</button></div>
  </section>
</div>
<div id="toast"></div>
<script>
const KEY='fruit-stand-tycoon-v1';
const FRUITS=[[0,'🍎','apples','#ff4d4d'],[1e3,'🍊','oranges','#ff9a3c'],[5e4,'🍓','strawberries','#ff4f8b'],[1e6,'🍉','watermelons','#3ddc84'],[5e7,'🍍','pineapples','#ffd23c'],[1e9,'🍇','grapes','#a35bff']];
const GENS=[
 {id:'basket',n:'Basket helper',e:'🧺',d:'A friend picks a few for you',c:15,p:.2},
 {id:'tree',n:'Apple tree',e:'🌳',d:'Grows fruit while you sleep',c:100,p:1},
 {id:'orchard',n:'Orchard',e:'🏡',d:'Rows and rows of trees',c:1100,p:8},
 {id:'truck',n:'Fruit truck',e:'🚚',d:'Delivers to the whole town',c:12000,p:47},
 {id:'green',n:'Greenhouse',e:'🪴',d:'Summer all year round',c:130000,p:260},
 {id:'factory',n:'Juice factory',e:'🏭',d:'Fruit in, profit out',c:1.4e6,p:1400},
 {id:'portal',n:'Fruit portal',e:'🌀',d:'Fruit from other dimensions',c:2e7,p:7800}];
const UPS=[
 {id:'u1',n:'Sticky gloves',e:'🧤',d:'Clicks give ×2',c:100,t:'click',m:2},
 {id:'u2',n:'Compost',e:'🌱',d:'Helpers and trees ×2',c:500,t:['basket','tree'],m:2},
 {id:'u3',n:'Fruit scissors',e:'✂️',d:'Clicks give ×2',c:2500,t:'click',m:2},
 {id:'u4',n:'Sprinklers',e:'💦',d:'Everything +25%',c:15000,t:'all',m:1.25},
 {id:'u5',n:'Busy bees',e:'🐝',d:'Orchards and trucks ×2',c:50000,t:['orchard','truck'],m:2},
 {id:'u6',n:'Golden gloves',e:'🏅',d:'Clicks give ×3',c:150000,t:'click',m:3},
 {id:'u7',n:'Sunshine deal',e:'☀️',d:'Everything +50%',c:1e6,t:'all',m:1.5},
 {id:'u8',n:'Robot pickers',e:'🤖',d:'Greenhouses and factories ×2',c:5e6,t:['green','factory'],m:2},
 {id:'u9',n:'Fruit fever',e:'🔥',d:'Everything ×2',c:1e8,t:'all',m:2}];
const fresh=()=>({fruit:0,total:0,pool:0,clicks:0,own:{},up:{},earned:0,pup:{},asc:0,t:Date.now()});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(!('pool' in p))p.pool=p.total||0;S=Object.assign(fresh(),p);}}catch(e){}
const $=id=>document.getElementById(id);
const fmt=n=>{if(n<1e3)return n<10&&n%1?n.toFixed(1):Math.floor(n).toString();const u=['','K','M','B','T','Qa'];let i=0;while(n>=1e3&&i<5){n/=1e3;i++}return (n<10?n.toFixed(2):n<100?n.toFixed(1):Math.floor(n))+u[i]};
const cost=(g)=>Math.ceil(g.c*Math.pow(1.15,S.own[g.id]||0)*(S.pup.pd?.9:1));
function mult(id){let m=1;for(const u of UPS)if(S.up[u.id]&&(u.t==='all'||(Array.isArray(u.t)&&u.t.includes(id))))m*=u.m;return m}
function allMult(){let m=1;for(const u of UPS)if(S.up[u.id]&&u.t==='all')m*=u.m;return m*pm()}
function gMult(id){let m=1;for(const u of UPS)if(S.up[u.id]&&Array.isArray(u.t)&&u.t.includes(id))m*=u.m;return m*allMult()*(S.pup.pb&&(id==='basket'||id==='tree')?2:1)}
const ps=()=>GENS.reduce((a,g)=>a+(S.own[g.id]||0)*g.p*gMult(g.id),0);
function pc(){let m=1;for(const u of UPS)if(S.up[u.id]&&u.t==='click')m*=u.m;if(S.pup.pc)m*=3;return (1*m+ps()*.01)*allMult()}
function stage(){let i=0;FRUITS.forEach((f,k)=>{if(S.total>=f[0])i=k});return i}

// prestige
const PUPS=[
 {id:'pa',n:'Green thumb',e:'👍',d:'Everything ×1.5',c:1},
 {id:'pb',n:'Bigger baskets',e:'🎒',d:'Basket helpers and trees ×2',c:2},
 {id:'pc',n:'Strong grip',e:'💪',d:'Clicks give ×3',c:3},
 {id:'pd',n:'Wholesale deal',e:'🏷️',d:'Pickers cost 10% less',c:5},
 {id:'pe',n:'Golden luck',e:'🍀',d:'Golden fruit comes twice as often and pays ×2',c:8},
 {id:'pf',n:'Eternal orchard',e:'🌲',d:'Everything ×2',c:15},
 {id:'pg',n:'Auto-picker',e:'🦾',d:'Clicks 5 times per second for you',c:25},
 {id:'ph',n:'Fruit god',e:'👑',d:'Everything ×3',c:50}];
const pm=()=>(1+.05*S.earned)*(S.pup.pa?1.5:1)*(S.pup.pf?2:1)*(S.pup.ph?3:1);
const fmtP=n=>{n=Math.max(0,n);return n>=100?n.toFixed(1):n>=1?n.toFixed(2):n.toFixed(3)};
const avail=()=>Math.max(0,S.earned-PUPS.reduce((a,p)=>a+(S.pup[p.id]?p.c:0),0));
const pamt=()=>S.pool*($('pslide').value/100);
function buildP(){$('pups').innerHTML=PUPS.map(p=>`<button class="item" data-p="${p.id}"><span class="e">${p.e}</span><span class="t"><div class="n">${p.n}</div><div class="d">${p.d}</div></span><span class="c" data-pc="${p.id}"></span></button>`).join('')}
function renderP(){
 const un=S.total>=1e5;$('pgui').hidden=!un;$('prest').hidden=!un;
 const amt=pamt(),pts=amt/1e6;
 $('ppn').textContent=fmtP(avail());$('pavail').textContent=fmtP(avail());$('pearn').textContent=fmtP(S.earned);
 $('pool').textContent=fmt(S.pool);$('pval').textContent=$('pslide').value+'%';
 $('ppre').textContent='Convert '+fmt(amt)+' picks into '+fmtP(pts)+' points';
 $('pconv').disabled=pts<=0;
 for(const p of PUPS){const el=document.querySelector(`[data-p="${p.id}"]`),own=S.pup[p.id];el.classList.toggle('done',!!own);el.classList.toggle('ok',!own&&avail()>=p.c);el.querySelector('[data-pc]').textContent=own?'Owned':p.c+' pt'}
}
function buyP(id){const p=PUPS.find(x=>x.id===id);if(!S.pup[id]&&avail()>=p.c){S.pup[id]=1;toast(p.e+' '+p.n+' unlocked');save();render()}}
function convert(){
 const amt=pamt(),pts=amt/1e6;if(pts<=0)return;
 S.pool-=amt;S.earned=Math.round((S.earned+pts)*1e6)/1e6;
 toast('+'+fmtP(pts)+' prestige points');save();render();
}
$('pslide').oninput=renderP;
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('pslide').value=b.dataset.q;renderP()});
$('pconv').onclick=convert;

// build shop once
function build(){
 $('gens').innerHTML=GENS.map(g=>`<button class="item" data-g="${g.id}"><span class="e">${g.e}</span><span class="t"><div class="n">${g.n}</div><div class="d">${g.d} · <span data-r="${g.id}"></span>/s each</div></span><span class="c" data-c="${g.id}"></span><span class="o" data-o="${g.id}"></span></button>`).join('');
}
build();buildP();
function renderUps(){
 const list=UPS.filter(u=>!S.up[u.id]).slice(0,3);
 $('ups').innerHTML=list.length?list.map(u=>`<button class="item" data-u="${u.id}"><span class="e">${u.e}</span><span class="t"><div class="n">${u.n}</div><div class="d">${u.d}</div></span><span class="c">${fmt(u.c)}</span></button>`).join(''):'<div class="chip">Every upgrade bought. Legendary.</div>';
}
function render(){
 const i=stage(),F=FRUITS[i];
 $('count').textContent=fmt(Math.floor(S.fruit));
 $('fname').textContent=F[2];$('emoji').textContent=F[1];
 document.documentElement.style.setProperty('--glow',F[3]);
 $('ps').textContent=fmt(ps());$('pc').textContent=fmt(pc());$('tot').textContent=fmt(S.pool);
 const N=FRUITS[i+1];
 if(N){const p=(S.total-F[0])/(N[0]-F[0]);$('bar').style.width=Math.min(100,p*100)+'%';$('next').textContent=N[1]+' '+N[2]+' unlock at '+fmt(N[0])}
 else{$('bar').style.width='100%';$('next').textContent='You grew every fruit.'}
 for(const g of GENS){const el=document.querySelector(`[data-g="${g.id}"]`);const c=cost(g);el.classList.toggle('ok',S.fruit>=c);
  el.querySelector('[data-c]').textContent=fmt(c);el.querySelector('[data-o]').textContent=S.own[g.id]||'';el.querySelector('[data-r]').textContent=fmt(g.p*gMult(g.id))}
 document.querySelectorAll('[data-u]').forEach(el=>{const u=UPS.find(x=>x.id===el.dataset.u);el.classList.toggle('ok',S.fruit>=u.c)});
 renderP();
}
function save(){try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S));$('saved').textContent='Saved '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch(e){$('saved').textContent='Saving unavailable in this browser'}}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2600)}
function gain(n){S.fruit+=n;S.total+=n;S.pool+=n}

// clicking
const st=$('stage');
$('fruit').addEventListener('click',e=>{
 const v=pc();gain(v);S.clicks++;
 const b=$('fruit');b.classList.add('pop');setTimeout(()=>b.classList.remove('pop'),90);
 const r=st.getBoundingClientRect();const x=(e.clientX||r.left+r.width/2)-r.left,y=(e.clientY||r.top+r.height/2)-r.top;
 const f=document.createElement('div');f.className='fx';f.textContent='+'+fmt(v);f.style.left=(x-16)+'px';f.style.top=(y-30)+'px';st.appendChild(f);setTimeout(()=>f.remove(),900);
 for(let k=0;k<4;k++){const p=document.createElement('div');p.className='bit';p.textContent=FRUITS[stage()][1];p.style.left=x+'px';p.style.top=y+'px';
  const a=Math.random()*6.28,d=50+Math.random()*60;p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d-20+'px');st.appendChild(p);setTimeout(()=>p.remove(),800)}
 render();
});
// buying
document.addEventListener('click',e=>{
 const b=e.target.closest('.item');if(!b)return;
 if(b.dataset.g){const g=GENS.find(x=>x.id===b.dataset.g),c=cost(g);if(S.fruit>=c){S.fruit-=c;S.own[g.id]=(S.own[g.id]||0)+1;save();render()}}
 if(b.dataset.p){buyP(b.dataset.p)}
 if(b.dataset.u){const u=UPS.find(x=>x.id===b.dataset.u);if(S.fruit>=u.c){S.fruit-=u.c;S.up[u.id]=1;toast(u.e+' '+u.n+' bought');renderUps();save();render()}}
});
// golden fruit
function goldLater(){setTimeout(()=>{if(document.hidden){goldLater();return}
 const g=document.createElement('button');g.id='gold';g.textContent='🌟';g.setAttribute('aria-label','Golden fruit bonus');
 g.style.left=(10+Math.random()*75)+'%';g.style.top=(12+Math.random()*50)+'%';
 g.onclick=()=>{const v=Math.max(ps()*60,pc()*40)*(S.pup.pe?2:1);gain(v);toast('Golden fruit! +'+fmt(v));g.remove();render()};
 st.appendChild(g);setTimeout(()=>g.remove(),12000);goldLater()},(S.pup.pe?.5:1)*(60000+Math.random()*60000))}
goldLater();
// reset
let rs=0;$('reset').onclick=function(){if(!rs){rs=1;this.textContent='Click again to erase';setTimeout(()=>{rs=0;this.textContent='Start over'},3000)}else{S=fresh();save();renderUps();render();rs=0;this.textContent='Start over'}};
// offline progress
const away=Math.min((Date.now()-S.t)/1000,7200);
if(away>30&&ps()>0){const v=ps()*away;gain(v);setTimeout(()=>toast('Welcome back! Your pickers gathered '+fmt(v)),400)}
renderUps();render();
let last=Date.now();
setInterval(()=>{const n=Date.now(),dt=(n-last)/1000;last=n;gain((ps()+(S.pup.pg?pc()*5:0))*Math.min(dt,5));render()},100);
setInterval(save,5000);
addEventListener('beforeunload',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
</script>
</body>
</html>
